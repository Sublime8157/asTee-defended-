# =============================================================================
# asTee — local container stack
#
#   docker compose up --build
#   open http://localhost:8000
#
# See docker/README.md for the database seeding step.
# =============================================================================

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: asTee
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"

      # Generated by the entrypoint on first boot if left empty. Set it
      # explicitly to keep sessions valid across container rebuilds.
      APP_KEY: "${APP_KEY:-}"

      # Hardcoded, NOT "${DB_USERNAME:-astee}". Compose interpolates ${...} from
      # the project's .env — the same file Laravel uses, where DB_USERNAME=root
      # and DB_PASSWORD is empty. That leaked in as MARIADB_USER=root, which the
      # MariaDB entrypoint refuses (root already exists), aborting first-boot
      # initialisation before the schema import ever ran. These credentials are
      # local-only and reach nothing outside this compose network.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: asTeeFinal
      DB_USERNAME: astee
      DB_PASSWORD: secret

      # Writes mail to the container log instead of sending it. The repo's .env
      # carries live Hostinger SMTP credentials; a local stack must not be able
      # to mail real customers.
      MAIL_MAILER: log

      # No jobs table exists in this schema yet, so the database queue driver
      # would fail. Phase 4 adds the table and moves mail off the request.
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_DRIVER: file
    volumes:
      # Uploaded files survive a rebuild. Product images, avatars, ID scans and
      # payment proofs all land here.
      - astee-storage:/var/www/html/storage/app/public
    restart: unless-stopped

  db:
    # 10.11 matches production: the dump's header reads
    # "Server version: 10.11.7-MariaDB-cll-lve". It is not MySQL — the schema
    # uses MariaDB CHECK (json_valid(...)) constraints, and docker/mysql-init/
    # uses MariaDB's ALTER TABLE ... ADD COLUMN IF NOT EXISTS.
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: asTeeFinal
      MARIADB_USER: astee
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      # Exposed so you can point a GUI client at it. Loopback only. DB_PORT_HOST
      # rather than DB_PORT: the latter is set in the project's .env, which
      # Compose reads, so the name would collide with Laravel's own config.
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    volumes:
      - astee-db:/var/lib/mysql
      # Scripts here run once, in filename order, on an empty data directory.
      # 01-schema.sql is the production dump and is gitignored — see
      # docker/README.md. 02-patch.sql adds the columns the dump predates.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  astee-db:
  astee-storage:
