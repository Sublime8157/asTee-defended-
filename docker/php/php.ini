; Uploads — the app accepts ID photos, payment proofs and product images, and
; validates them at max:2048 (2MB). Headroom for the multipart envelope.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

; Never render PHP errors into the response body. Laravel's own handler decides
; what the user sees, governed by APP_DEBUG.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
