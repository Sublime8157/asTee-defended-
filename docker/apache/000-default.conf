<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # DocumentRoot is public/, not the project root.
    #
    # The repo's root .htaccess rewrites requests into public/ and additionally
    # maps /storage/ straight onto storage/app/public/. That arrangement serves
    # the whole project directory — .env, vendor/, storage/ and the database
    # dump all sit under the served path, protected only by rewrite ordering.
    # Pointing DocumentRoot at public/ is the correct fix, and it makes that
    # root .htaccess inert.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces: even if DocumentRoot is ever misconfigured, refuse to
    # serve dotfiles and database dumps.
    <FilesMatch "^\.|\.(sql|env|log)$">
        Require all denied
    </FilesMatch>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
